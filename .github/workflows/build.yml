name: build

on:
  workflow_dispatch:
  push:
    branches: [master]
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            args: "--bundles nsis"
          # Oldest runner available, because an AppImage only runs on glibc at
          # least as new as the one it was built against.
          - os: ubuntu-22.04
            name: linux
            args: "--bundles deb,appimage"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Install Linux build dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libssl-dev build-essential file

      - name: Cache sidecar downloads
        uses: actions/cache@v4
        with:
          path: .sidecar-cache
          key: sidecars-${{ matrix.name }}-${{ hashFiles('scripts/fetch-sidecars.mjs', 'scripts/build-whisper-vulkan.mjs') }}

      - name: Fetch sidecars
        run: node scripts/fetch-sidecars.mjs
        env:
          SIDECAR_SKIP: ${{ matrix.name == 'windows' && 'whisper' || '' }}

      # whisper.cpp ships no Vulkan binaries, so the GPU build is compiled here.
      - name: Install Vulkan SDK
        if: matrix.name == 'windows'
        uses: jakoch/install-vulkan-sdk-action@v1.6.0
        with:
          vulkan_version: 1.4.313.2
          install_runtime: false
          cache: true
          stripdown: true

      - name: Build whisper with Vulkan
        if: matrix.name == 'windows'
        run: node scripts/build-whisper-vulkan.mjs

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Declaring an updater pubkey makes every bundle a signed one, so the
          # key is needed for plain builds too, not just releases.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # linuxdeploy mounts itself to run, which needs FUSE the runner does
          # not have. Extracting instead is the supported way round it.
          APPIMAGE_EXTRACT_AND_RUN: 1
        with:
          projectPath: app
          args: ${{ matrix.args }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: chaptr ${{ github.ref_name }}
          # latest.json is what installed copies poll, and a draft release does
          # not serve it, so tags publish straight away.
          includeUpdaterJson: true
          releaseDraft: false

      - uses: actions/upload-artifact@v4
        with:
          name: chaptr-${{ matrix.name }}
          retention-days: 14
          if-no-files-found: error
          path: |
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/appimage/*.AppImage
            app/src-tauri/target/release/bundle/deb/*.deb
