[package]
name = "chaptr"
version = "0.1.5"
edition = "2021"
# Two binaries ship, so the bundler has to be told which one is the app.
# The app binary is named after the product on purpose: on Wayland the
# compositor matches a window to its .desktop file by app id, which is the
# binary name, so chaptr-app would find no chaptr.desktop and show a
# placeholder icon.
default-run = "chaptr"

[lib]
name = "chaptr"
path = "src/lib.rs"

[[bin]]
name = "chaptr"
path = "src/main.rs"

[[bin]]
name = "chaptr-cli"
path = "src/bin/cli.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# On by default so a plain `cargo build` produces a working app. Without it
# Tauri serves devUrl and the window shows "Connection refused".
# Use --no-default-features only when running against a dev server.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
chrono = "0.4"
regex = "1"
walkdir = "2"
blake3 = "1"
flate2 = "1"
ureq = { version = "2", features = ["json"] }
