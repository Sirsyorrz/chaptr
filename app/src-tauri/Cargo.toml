[package]
name = "chaptr"
version = "0.1.0"
edition = "2021"

[lib]
name = "chaptr"
path = "src/lib.rs"

[[bin]]
name = "chaptr-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
